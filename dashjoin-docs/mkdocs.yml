site_name: Dashjoin Platform Documentation
theme:
  name: material
  custom_dir: overrides

#
# Use version management
# see: https://squidfunk.github.io/mkdocs-material/setup/setting-up-versioning/
extra:
  version:
    provider: mike

#
# Search: also split code tokens at punctuation (quotes, brackets, $, dots, etc.)
# so that terms inside code blocks can be found
# see: https://squidfunk.github.io/mkdocs-material/plugins/search/#config.separator
#
plugins:
  - search:
      separator: '[\s\u200b\-,:;!=\[\]{}()"''`$/*+<>|]+|\.(?!\d)|&[lg]t;|&amp;'

#
# Enable code highlighting
#
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Overview: 'index.md'
  - 'getting-started.md'
  - 'concepts.md'
  - 'user-interface.md'
  - 'widget-reference.md'
  - Functions: 'developer-reference.md'
  - 'jsonata-reference.md'
  - 'i18n.md'
  - 'ai-ml-integration.md'
  - 'installation.md'
  - 'administration.md'
  - 'development-production.md'
  - Security and Access Control: 'security.md'
  - 'support-matrix.md'
  - 'api.md'
  - 'faq.md'
  - 'contribute.md'
  - 'appendix-configurations.md'
  - 'appendix-inputs.md'
  - 'appendix-jsonata.md'
  - 'appendix-widgets.md'
