<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- the default brand background: login page (assets/theme.css, class brand-bg) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d47a1"/>
      <stop offset="0.55" stop-color="#1976d2"/>
      <stop offset="1" stop-color="#42a5f5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2">
    <path d="M0 760 C 300 680, 520 860, 820 780 S 1350 640, 1600 720"/>
    <path d="M0 820 C 320 740, 560 920, 860 840 S 1380 700, 1600 790"/>
    <path d="M0 880 C 340 800, 600 980, 900 900 S 1410 760, 1600 860"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.08">
    <circle cx="180" cy="160" r="120"/>
    <circle cx="1380" cy="820" r="200"/>
    <circle cx="1240" cy="260" r="60"/>
  </g>
</svg>
